<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>IRIAM Panel</title>

<style>

body{
margin:0;
padding:10px;
font-family:sans-serif;
background:#f4f6fa;
text-align:center;
}

.container{
position:relative;
width:min(95vw,900px);
margin:auto;
}

#mainImage{
width:100%;
display:block;
}

#grid{
position:absolute;
inset:0;
display:grid;
}

.panel{
position:relative;
overflow:hidden;
perspective:1000px;
}

.door-left,
.door-right{

position:absolute;
top:0;
width:50%;
height:100%;

display:flex;
align-items:center;
justify-content:center;

background:#4285f4;
color:white;

transition:1s;

font-size:
clamp(
10px,
1vw,
18px
);

padding:3px;
text-align:center;
}

.door-left{
left:0;
transform-origin:left center;
}

.door-right{
right:0;
transform-origin:right center;
}

.panel.open .door-left{
transform:rotateY(-135deg);
}

.panel.open .door-right{
transform:rotateY(135deg);
}

button{
padding:10px;
margin:5px;
}

.hidden{
display:none;
}

</style>
</head>
<body>

<h1 id="title"></h1>

<div id="loginArea">

<button onclick="adminLogin()">
管理者ログイン
</button>

<button onclick="randomOpen()">
ランダム開放
</button>

<button onclick="openAll()">
全開
</button>

<button onclick="resetPanels()">
リセット
</button>

</div>

<div class="container">

<img
id="mainImage"
src="">

<div id="grid"></div>

</div>

<script>

const USERS = {

    hina:{
        name:"ひな",
        password:"hina2026",
        image:"images/hina.jpg",
        gridSize:5
    },

    aoi:{
        name:"あおい",
        password:"aoi2026",
        image:"images/aoi.jpg",
        gridSize:4
    },

    yuto:{
        name:"ゆと",
        password:"yuto2026",
        image:"images/yuto.jpg",
        gridSize:10
    }

};

const params =
new URLSearchParams(
window.location.search
);

const userId =
params.get("user");

if(
!userId ||
!USERS[userId]
){

document.body.innerHTML=
"<h1>ページが見つかりません</h1>";

throw new Error();

}

const USER =
USERS[userId];

const STORAGE_KEY =
"panel_" + userId;

document
.getElementById("title")
.innerText=
USER.name + " パネル開け";

document
.getElementById("mainImage")
.src=
USER.image;

const grid =
document.getElementById("grid");

grid.style.gridTemplateColumns =
`repeat(${USER.gridSize},1fr)`;

let isAdmin=false;

const total=
USER.gridSize*
USER.gridSize;

const saved=
JSON.parse(
localStorage.getItem(
STORAGE_KEY
)||"{}"
);

for(
let i=0;
i<total;
i++
){

const panel=
document.createElement("div");

panel.className="panel";

panel.dataset.id=i;

panel.innerHTML=`
<div class="door-left">
${i+1}
</div>

<div class="door-right">
?
</div>
`;

if(saved[i]){

panel.classList.add("open");

}

panel.onclick=
()=>openPanel(i);

grid.appendChild(panel);

}

function adminLogin(){

const pass=
prompt(
"パスワード"
);

if(
pass===
USER.password
){

isAdmin=true;

alert(
"管理者モード"
);

}else{

alert(
"認証失敗"
);

}

}

function saveState(id){

const data=
JSON.parse(
localStorage.getItem(
STORAGE_KEY
)||"{}"
);

data[id]=true;

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(data)
);

}

function openPanel(id){

if(!isAdmin) return;

const panel=
document.querySelector(
`[data-id="${id}"]`
);

panel.classList.add(
"open"
);

saveState(id);

}

function randomOpen(){

if(!isAdmin)return;

const closed=
[
...document.querySelectorAll(
".panel"
)
]
.filter(
p=>
!p.classList.contains(
"open"
)
);

if(
closed.length===0
)return;

const target=
closed[
Math.floor(
Math.random()*
closed.length
)
];

target.click();

}

function openAll(){

if(!isAdmin)return;

document
.querySelectorAll(
".panel"
)
.forEach(
p=>{
if(
!p.classList.contains(
"open"
)
){
p.click();
}
}
);

}

function resetPanels(){

if(!isAdmin)return;

localStorage.removeItem(
STORAGE_KEY
);

location.reload();

}

</script>

</body>
</html>
